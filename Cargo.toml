[workspace]
resolver = "3"
members = [
    "crates/acme",
    "crates/admin",
    "crates/app-deploy",
    "crates/config",
    "crates/desk",
    "crates/dns",
    "crates/identity",
    "crates/igd",
    "crates/login",
    "crates/firewall",
    "crates/git",
    "crates/http",
    "crates/json",
    "crates/mail",
    "crates/mesh",
    "crates/proxy",
    "crates/screen",
    "crates/storage",
    "crates/ws",
    "crates/reports",
    "crates/supervisor",
    "crates/rui",
    "crates/console",
    "crates/vpn-ui",
    "crates/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/RockyWearsAHat/selfhost"

# Dependency policy
# -----------------
# Two categories of dependency are permitted, and nothing else:
#
#   1. Foundations — the async runtime and the TLS/crypto implementation. These
#      sit at the same level as the standard library. Hand-writing cryptography
#      would make this project less safe, not more independent.
#   2. Serialisation of our own config format.
#
# Everything above the socket is written here: HTTP parsing, the reverse proxy,
# load balancing, health checking, Range handling, ACME, the DNS wire format,
# SMTP, and IMAP. If a protocol is on the wire, we own it.
[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "fs", "time", "signal", "sync", "process"] }
# Both pinned to `ring` rather than to their default provider. rustls defaults
# to aws-lc-rs and rcgen uses ring, so accepting both defaults compiles *two*
# independent cryptographic implementations into one binary — two lots of C and
# assembly, two supply chains, and two sets of advisories to track, to do one
# job. One provider, chosen deliberately, is the whole point of the policy above.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pemfile = "2"
rcgen = "0.13"
# P-256 for the ACME account key and JWS signing — the same `ring` the rest of
# the stack already links, so no second crypto implementation is added.
ring = "0.17"
# The trust anchors used to verify the ACME endpoint's own TLS certificate.
# Bundled Mozilla roots are deterministic across the Win/mac/Linux matrix, where
# reading the OS store would vary by platform. This is the one dependency the
# ACME work adds above the socket; verification is never disabled.
webpki-roots = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"

selfhost-acme = { path = "crates/acme" }
selfhost-admin = { path = "crates/admin" }
selfhost-app-deploy = { path = "crates/app-deploy" }
selfhost-config = { path = "crates/config" }
selfhost-desk = { path = "crates/desk" }
selfhost-dns = { path = "crates/dns" }
selfhost-identity = { path = "crates/identity" }
selfhost-igd = { path = "crates/igd" }
selfhost-firewall = { path = "crates/firewall" }
selfhost-git = { path = "crates/git" }
selfhost-http = { path = "crates/http" }
selfhost-json = { path = "crates/json" }
selfhost-login = { path = "crates/login" }
selfhost-mail = { path = "crates/mail" }
selfhost-mesh = { path = "crates/mesh" }
selfhost-proxy = { path = "crates/proxy" }
selfhost-reports = { path = "crates/reports" }
selfhost-screen = { path = "crates/screen" }
selfhost-storage = { path = "crates/storage" }
selfhost-supervisor = { path = "crates/supervisor" }
selfhost-ws = { path = "crates/ws" }
rui = { path = "crates/rui" }

# The release profile is what the self-updater rebuilds on every push, so its
# job is to be *fast to rebuild*, not to squeeze the last percent of runtime
# out of an I/O-bound server. LTO with one codegen unit re-links the whole
# binary from scratch on any change and was the bulk of each deploy's build
# time; parallel codegen plus incremental reuse turns a push into a rebuild of
# only what changed.
[profile.release]
opt-level = 3
lto = false
codegen-units = 16
incremental = true
panic = "abort"
strip = true
# Nothing reads a backtrace off the deployed binary — it is stripped, and the
# daemon reports faults in its own words — so debug info is pure build time and
# disk. Stated rather than left to the default, because `strip` hides the cost
# instead of removing it: the info is still generated, then thrown away.
debug = false

# Build scripts and proc macros run at *compile* time and their generated code
# is never in the shipped binary, so optimising them is time spent making the
# build slower. `ring`'s build script compiles C, and `serde`'s derive is a
# proc macro every crate in the workspace pulls on; both are cold-build cost.
# Many codegen units because these are compiled once and not linked into
# anything whose runtime matters.
[profile.release.build-override]
opt-level = 0
codegen-units = 256
incremental = false
debug = false

# The same reasoning for the profile the tests run under: `cargo test` on this
# workspace rebuilds the same proc macros, and nobody steps through a derive.
[profile.dev.build-override]
opt-level = 0
codegen-units = 256
debug = false

[profile.dev]
# Enough to name a frame in a panic, without the cost of full debug info for
# every local in a 30,000-line workspace. Line tables are what a backtrace
# actually reads.
debug = "line-tables-only"
