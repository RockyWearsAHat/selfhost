[workspace]
resolver = "3"
# The five layers are a dependency order, not a filing convention: a crate may
# depend on its own layer and on the layers above it in this list, and never
# downward. `cargo tree` is the check, and the arrangement was derived from the
# real graph rather than chosen first — which is why `login` and `supervisor`
# sit in foundation (they depend on nothing but `json`/`config`) and `proxy`
# sits in app (it depends on `mail` and `admin`, so it is not a network crate
# however much its name suggests one).
members = [
    # foundation — primitives. Nothing here reaches for a socket of its own.
    "crates/foundation/json",
    "crates/foundation/http",
    "crates/foundation/config",
    "crates/foundation/identity",
    "crates/foundation/login",
    "crates/foundation/presence",
    "crates/foundation/supervisor",

    # net — the wire. Protocols we own, byte for byte.
    "crates/net/igd",
    "crates/net/ws",
    "crates/net/dns",
    "crates/net/acme",
    "crates/net/firewall",

    # services — the capabilities a deployment actually offers.
    "crates/services/desk",
    "crates/services/screen",
    "crates/services/mail",
    "crates/services/mesh",
    "crates/services/storage",
    "crates/services/git",
    "crates/services/reports",
    "crates/services/app-deploy",
    "crates/services/vpn",

    # ui — the two apps. The toolkit they are written in, `rui`, is not here:
    # it is its own project, consumed as a pinned git dependency below.
    "crates/ui/console",
    "crates/ui/vpn-ui",

    # app — the top: the control API, the proxy that composes every service,
    # and the one binary an operator runs.
    "crates/app/admin",
    "crates/app/proxy",
    "crates/app/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/RockyWearsAHat/selfhost"

# Dependency policy
# -----------------
# Three categories of dependency are permitted, and nothing else:
#
#   1. Foundations — the async runtime and the TLS/crypto implementation. These
#      sit at the same level as the standard library. Hand-writing cryptography
#      would make this project less safe, not more independent.
#   2. Serialisation of our own config format.
#   3. Our own projects, by pinned revision. Today that is exactly one: `rui`,
#      the interface library the two desktop applications are written in. It is
#      not a third-party package — it is written here, in a separate repository,
#      because nothing in it knows what selfhost is. Vendoring it by path was the
#      alternative, and it produced two copies that drifted. A pin is not a
#      loosening of this policy: it is the same rule applied to code that had
#      been exempt from it by being copied instead of depended on.
#
# Everything above the socket is written here: HTTP parsing, the reverse proxy,
# load balancing, health checking, Range handling, ACME, the DNS wire format,
# SMTP, and IMAP. If a protocol is on the wire, we own it.
[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "fs", "time", "signal", "sync", "process"] }
# Both pinned to `ring` rather than to their default provider. rustls defaults
# to aws-lc-rs and rcgen uses ring, so accepting both defaults compiles *two*
# independent cryptographic implementations into one binary — two lots of C and
# assembly, two supply chains, and two sets of advisories to track, to do one
# job. One provider, chosen deliberately, is the whole point of the policy above.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pemfile = "2"
rcgen = "0.13"
# P-256 for the ACME account key and JWS signing — the same `ring` the rest of
# the stack already links, so no second crypto implementation is added.
ring = "0.17"
# The trust anchors used to verify the ACME endpoint's own TLS certificate.
# Bundled Mozilla roots are deterministic across the Win/mac/Linux matrix, where
# reading the OS store would vary by platform. This is the one dependency the
# ACME work adds above the socket; verification is never disabled.
webpki-roots = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"

selfhost-acme = { path = "crates/net/acme" }
selfhost-admin = { path = "crates/app/admin" }
selfhost-app-deploy = { path = "crates/services/app-deploy" }
selfhost-config = { path = "crates/foundation/config" }
selfhost-desk = { path = "crates/services/desk" }
selfhost-dns = { path = "crates/net/dns" }
selfhost-identity = { path = "crates/foundation/identity" }
selfhost-igd = { path = "crates/net/igd" }
selfhost-firewall = { path = "crates/net/firewall" }
selfhost-git = { path = "crates/services/git" }
selfhost-http = { path = "crates/foundation/http" }
selfhost-json = { path = "crates/foundation/json" }
selfhost-login = { path = "crates/foundation/login" }
selfhost-mail = { path = "crates/services/mail" }
selfhost-mesh = { path = "crates/services/mesh" }
selfhost-presence = { path = "crates/foundation/presence" }
selfhost-proxy = { path = "crates/app/proxy" }
selfhost-reports = { path = "crates/services/reports" }
selfhost-screen = { path = "crates/services/screen" }
selfhost-storage = { path = "crates/services/storage" }
selfhost-supervisor = { path = "crates/foundation/supervisor" }
selfhost-vpn = { path = "crates/services/vpn" }
selfhost-ws = { path = "crates/net/ws" }
# rui is NOT part of this project. It is a zero-dependency interface library
# with its own repository, nothing in it knows selfhost exists, and it was
# vendored here by path until 2026-08-17 — which meant two copies that had to be
# kept in step by hand, and which had silently drifted ~2,300 lines apart.
#
# Pinned to an exact revision rather than tracking `main` on purpose: the
# production box self-updates from every push to this repository and rebuilds
# unattended, so a moving dependency would let unreviewed interface changes onto
# it without anyone deciding. Bumping `rev` is therefore a deliberate commit that
# shows up in review, which is the whole point.
rui = { git = "https://github.com/RockyWearsAHat/rui.git", rev = "80e3003563c26952e4d63c52d8eb8f5052cb463c" }

# The release profile is what the self-updater rebuilds on every push, so its
# job is to be *fast to rebuild*, not to squeeze the last percent of runtime
# out of an I/O-bound server. LTO with one codegen unit re-links the whole
# binary from scratch on any change and was the bulk of each deploy's build
# time; parallel codegen plus incremental reuse turns a push into a rebuild of
# only what changed.
# Editing rui while working here
# ------------------------------
# The pin above is what builds. To change rui itself, clone it beside this
# repository and uncomment the two lines below — cargo then builds every `rui`
# dependency from your working copy instead of the pinned revision, so an edit
# is visible in `selfhost-console` immediately, with no commit and no bump:
#
#     git clone https://github.com/RockyWearsAHat/rui.git ../rui
#
# [patch."https://github.com/RockyWearsAHat/rui.git"]
# rui = { path = "../rui" }
#
# Uncommented, this file no longer builds on a machine without `../rui` — which
# includes the production box. So: uncomment to work, push the rui change to its
# own repository, bump `rev` above, and re-comment before committing. Anything
# else recreates the two-copies problem this replaced.

[profile.release]
opt-level = 3
lto = false
codegen-units = 16
incremental = true
panic = "abort"
strip = true
# Nothing reads a backtrace off the deployed binary — it is stripped, and the
# daemon reports faults in its own words — so debug info is pure build time and
# disk. Stated rather than left to the default, because `strip` hides the cost
# instead of removing it: the info is still generated, then thrown away.
debug = false

# Build scripts and proc macros run at *compile* time and their generated code
# is never in the shipped binary, so optimising them is time spent making the
# build slower. `ring`'s build script compiles C, and `serde`'s derive is a
# proc macro every crate in the workspace pulls on; both are cold-build cost.
# Many codegen units because these are compiled once and not linked into
# anything whose runtime matters.
[profile.release.build-override]
opt-level = 0
codegen-units = 256
incremental = false
debug = false

# The same reasoning for the profile the tests run under: `cargo test` on this
# workspace rebuilds the same proc macros, and nobody steps through a derive.
[profile.dev.build-override]
opt-level = 0
codegen-units = 256
debug = false

[profile.dev]
# Enough to name a frame in a panic, without the cost of full debug info for
# every local in a 30,000-line workspace. Line tables are what a backtrace
# actually reads.
debug = "line-tables-only"
