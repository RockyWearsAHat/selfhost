[package]
name = "selfhost-console"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The desktop console: one window showing everything the daemon is running."

[[bin]]
name = "selfhost-console"
path = "src/main.rs"

[dependencies]
# The random source behind the handshake nonce and the per-frame masks RFC 6455
# requires of a client. The same `ring` the workspace already links, not a
# second one.
ring = { workspace = true }
selfhost-config = { workspace = true }
# The remote-desktop vocabulary: the message codec, the tile codec and the key
# table. Pure and platform-free by its own manifest, which is what makes it the
# crate both consoles link rather than each inventing a parser for the same
# bytes.
selfhost-desk = { workspace = true }
selfhost-firewall = { workspace = true }
selfhost-http = { workspace = true }
selfhost-json = { workspace = true }
# The lock in front of every connection: ask the operating system to prove a
# person is at this computer — Touch ID, or the account password behind it. The
# one crate here that is allowed `unsafe` on this one's behalf, which is what
# lets this one go on forbidding it.
selfhost-presence = { workspace = true }
# The two platform key tables, in the one direction they are written and read
# backwards here. See `remote::usage_for_code` for why a second table is the one
# thing a keystroke forwarder must never write.
selfhost-screen = { workspace = true }
selfhost-supervisor = { workspace = true }
# RFC 6455 framing and the handshake's accept key. The codec is pure; nothing
# here starts a runtime, and the desktop stream is read on an ordinary blocking
# thread beside the poller's.
selfhost-ws = { workspace = true }
rui = { workspace = true }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
