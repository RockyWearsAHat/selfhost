[package]
name = "selfhost-vpn-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The desktop VPN panel: one window to bring up the Secure-VPN tunnel and reach the admin console."

[[bin]]
name = "selfhost-vpn-ui"
path = "src/main.rs"

# The console gate: the loopback 443 → 8443 bridge the app installs once as a
# LaunchDaemon so the admin console opens at its portless URL. See the bin's
# module doc and docs/SECURITY.md (VPN-04).
[[bin]]
name = "selfhost-console-gate"
path = "src/bin/console-gate.rs"

# The Secure-VPN Mac auto-updater: run once at login/boot by a per-user
# LaunchAgent the app installs. See the bin's module doc and docs/VPN.md.
[[bin]]
name = "securevpn-updater"
path = "src/bin/securevpn-updater.rs"

[dependencies]
rui = { workspace = true }
selfhost-dns = { workspace = true }
selfhost-http = { workspace = true }
selfhost-json = { workspace = true }
nix = { version = "0.29", features = ["process", "hostname"] }
ring = { workspace = true }
rustls = { workspace = true }
webpki-roots = { workspace = true }

[lints.rust]
unsafe_code = "warn"
missing_docs = "warn"
