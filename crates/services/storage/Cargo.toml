[package]
name = "selfhost-storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Network attached storage: shares, the safe path resolver, streamed file I/O, WebDAV, and SMB delegation."

[dependencies]
# PBKDF2 verification for share credentials reuses the console password hash.
ring = { workspace = true }
selfhost-config = { workspace = true }
# The DNS-SD records `discover` derives are expressed in the project's own wire
# vocabulary (`selfhost_dns::wire::{Record, RecordData}`) rather than in a model
# invented here, so the records this crate hands to a platform advertiser and the
# records `crates/dns` would serve are the same types. Nothing in this crate
# encodes or transmits one — publication is delegated; see `discover`.
selfhost-dns = { workspace = true }
selfhost-http = { workspace = true }
selfhost-identity = { workspace = true }
selfhost-json = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }

[lints.rust]
# Not `forbid`: the one thing that makes a share a share rather than a hole in
# the box — resolving a path one component at a time against an **open directory
# descriptor**, so a symlink planted mid-walk is refused instead of followed —
# has no safe standard-library route on either platform. `std` opens by whole
# path, and a whole path is exactly what an attacker gets to redirect.
#
# The exemption is confined to `src/fs/unix.rs` (`openat`, `unlinkat`,
# `mkdirat`, `renameat` and `fstatfs`, one declaration each) and
# `src/fs/windows.rs` (`NtCreateFile` relative to a parent handle,
# `SetFileInformationByHandle` to delete and to rename through one,
# `GetFileInformationByHandle` for volume identity, and `GetDiskFreeSpaceExW`
# for the free-space floor). Every one of them is either a relative operation
# with no whole-path spelling — which is the confinement — or a number the write
# path is gated on that `std` does not expose. It is granted with an explicit
# `#[allow(unsafe_code)]` per declaration and per call site rather than
# crate-wide. No other module in the crate contains `unsafe`: the whole security
# core — `path`, `share`, `listing`, `respond`, `quota`, `auth`, `api` and the
# WebDAV bodies — is pure safe Rust and is meant to stay that way.
unsafe_code = "deny"
missing_docs = "warn"
