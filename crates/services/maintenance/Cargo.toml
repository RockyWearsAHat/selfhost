[package]
name = "selfhost-maintenance"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Scheduled host maintenance and graceful reboot scheduler"

[dependencies]
tokio = { workspace = true, features = ["sync", "time"] }
chrono = "0.4"
chrono-tz = "0.8"
tracing = "0.1"
serde = { workspace = true, features = ["derive"] }

selfhost-config = { workspace = true }
selfhost-json = { workspace = true }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
