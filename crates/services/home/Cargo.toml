[package]
name = "selfhost-home"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The house: every controllable device on the local network, discovered, held in one state, and driven through one loopback API."

[dependencies]
selfhost-config = { workspace = true }
selfhost-http = { workspace = true }
selfhost-json = { workspace = true }
# `io-std` on top of the workspace set: the MCP surface speaks JSON-RPC over
# this process's own stdio, which no other subsystem needs.
tokio = { workspace = true, features = ["io-std"] }
# The Fire TV remote API is HTTPS on a self-signed certificate, so this crate
# needs a TLS client where every other protocol it speaks needs none. Pinned to
# the workspace's `ring` provider like every other rustls user here.
tokio-rustls = { workspace = true }
rustls = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
