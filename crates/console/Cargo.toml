[package]
name = "selfhost-console"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The desktop console: one window showing everything the daemon is running."

[[bin]]
name = "selfhost-console"
path = "src/main.rs"

[dependencies]
selfhost-config = { workspace = true }
selfhost-firewall = { workspace = true }
selfhost-http = { workspace = true }
selfhost-json = { workspace = true }
selfhost-supervisor = { workspace = true }
