[package]
name = "selfhost-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The selfhost command-line interface."

[[bin]]
name = "selfhost"
path = "src/main.rs"

[dependencies]
selfhost-acme = { workspace = true }
selfhost-admin = { workspace = true }
selfhost-config = { workspace = true }
selfhost-desk = { workspace = true }
selfhost-dns = { workspace = true }
selfhost-identity = { workspace = true }
# The console's own JSON, for the one place `doctor` reads an answer back from
# the running daemon over loopback. A workspace crate with no dependencies of
# its own; nothing new enters the tree by naming it.
selfhost-json = { workspace = true }
selfhost-screen = { workspace = true }
selfhost-storage = { workspace = true }
selfhost-ws = { workspace = true }
selfhost-firewall = { workspace = true }
selfhost-git = { workspace = true }
selfhost-mail = { workspace = true }
selfhost-mesh = { workspace = true }
selfhost-proxy = { workspace = true }
selfhost-registrar = { workspace = true }
selfhost-reports = { workspace = true }
# The system random source, for the one secret this binary mints itself: the
# report feed's bearer token. The same `ring` rustls already links through
# `selfhost-proxy`; naming it here adds nothing new to the tree.
ring = { workspace = true }
selfhost-http = { workspace = true }
selfhost-supervisor = { workspace = true }
tokio = { workspace = true }
rustls = { workspace = true }
tokio-rustls = { workspace = true }
# The trust anchors the mesh dialler verifies the owner's certificate against.
# The same bundle `selfhost-acme` already links, chosen for the same reason: it
# is deterministic across the Win/mac/Linux matrix where reading the OS store
# would vary by platform. Nothing new enters the workspace by naming it here.
webpki-roots = { workspace = true }

[dev-dependencies]
# `test-util` only, and only for tests: the kill switch's requirement is that an
# engaged switch reaches a running stream inside one poll, and asserting that
# against the wall clock would mean a test that sleeps for twenty seconds — which
# is a test nobody runs. Pausing the runtime's clock asserts the same property in
# microseconds. No package enters the tree; this is a feature of the async
# runtime the workspace already depends on, and it is not compiled into a release
# build.
tokio = { workspace = true, features = ["test-util"] }

[lints.rust]
unsafe_code = "forbid"
