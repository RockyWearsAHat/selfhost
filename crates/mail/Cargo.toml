[package]
name = "selfhost-mail"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "SMTP and IMAP, written from the specifications. Custom-domain email without a subscription."

[dependencies]
selfhost-config = { workspace = true }
selfhost-dns = { workspace = true }
tokio = { workspace = true }
# STARTTLS on submission (server side) and opportunistic TLS on outbound
# delivery (client side). Same provider as the rest of the stack.
tokio-rustls = { workspace = true }
rustls = { workspace = true }
# DKIM signing and key generation. `ring` is the one crypto provider the project
# links; DKIM adds no second one — RSA keys, which `ring` cannot generate, are
# loaded rather than generated (see `dkim`).
ring = { workspace = true }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
