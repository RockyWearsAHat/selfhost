<!doctype html>
<!-- Design comp: television plates on INSTRUMENT, phone width. Living Room TV
     (Fire TV 4K) showing YouTube with apps, volume, and d-pad remote control;
     Bedroom TV (Vega) idle, apps-only, no remote keys. Markup patterns from
     phone-player.html reference comp; every visual device maps to a named
     rui capability per instrument.css. -->
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>comp — televisions</title>
<link rel="stylesheet" href="instrument.css">
</head><body>

<main id="rooms">
<div class="room">
  <div class="section-rule"><h2>LIVING ROOM</h2><span class="rule"></span><span class="micro">1 DEVICE</span></div>
  <div class="roomdevices">

  <!-- Living Room TV (Fire TV 4K) showing YouTube, with app switcher,
       volume control, and full d-pad remote with directional keys and HOME/BACK. -->
  <section class="plate device">
    <div class="title-rule">
      <span class="title">Living Room TV</span><span class="rule"></span>
      <span class="kind">Television</span><span class="lamp live"></span>
    </div>
    <p class="doing">Showing YouTube.</p>
    <div class="tvrow">
      <div class="screenwell">
        <span class="appname">YouTube</span>
        <span class="running">Running</span>
      </div>
      <div class="tvpanel">
        <div class="cap-apps">
          <button class="btn small ghost" aria-pressed="true">YOUTUBE</button>
          <button class="btn small ghost">NETFLIX</button>
          <button class="btn small ghost">PRIME</button>
          <button class="btn small ghost">SPOTIFY</button>
          <button class="btn small">STOP</button>
        </div>
      </div>
    </div>
    <div class="cap-volume">
          <span class="fieldlabel">Volume</span>
          <input type="range" min="0" max="100" value="45" aria-label="Volume">
          <span class="value">45</span>
          <button class="btn small ghost">MUTE</button>
        </div>
    <div class="cap-keys">
      <div class="dpad">
        <button class="up">&#x25B2;&#xFE0E;</button>
        <button class="left">&#x25C0;&#xFE0E;</button>
        <button class="okbtn">OK</button>
        <button class="right">&#x25B6;&#xFE0E;</button>
        <button class="down">&#x25BC;&#xFE0E;</button>
      </div>
      <div class="keycol">
        <button class="btn small ghost">BACK</button>
        <button class="btn small ghost">HOME</button>
      </div>
    </div>
    <span class="address mono">192.168.1.4 &middot; dial</span>
  </section>

  </div>
</div>

<div class="room">
  <div class="section-rule"><h2>BEDROOM</h2><span class="rule"></span><span class="micro">1 DEVICE</span></div>
  <div class="roomdevices">

  <!-- Bedroom TV (Vega), apps-only: no remote keypad, no volume control.
       The screenwell reads as idle glass; apps available to launch. -->
  <section class="plate device">
    <div class="title-rule">
      <span class="title">Bedroom TV</span><span class="rule"></span>
      <span class="kind">Television</span><span class="lamp ok"></span>
    </div>
    <p class="doing">Nothing running.</p>
    <div class="screenwell dark">
      <span class="appname">Nothing running</span>
    </div>
    <div class="cap-apps">
      <button class="btn small ghost">YOUTUBE</button>
      <button class="btn small ghost">NETFLIX</button>
      <button class="btn small ghost">PRIME</button>
      <button class="btn small ghost">SPOTIFY</button>
    </div>
    <p class="doing">Apps only — this set takes no keys.</p>
    <span class="address mono">192.168.1.12 &middot; dial</span>
  </section>

  </div>
</div>
</main>
</body></html>
